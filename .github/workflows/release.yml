name: Release

# 打 tag（v0.2.0）或手动触发，产出一个能直接装到手机上的 APK 并挂到 GitHub Release。
# 注意：Gradle 构建期不校验 GLSL，所以这里跑单测与 lint，但着色器本身只有跑起来才知道对不对。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v0.2.0）。留空则用 build-<run_number>'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          # versionCode 必须单调递增，否则装不上（覆盖安装会被系统拒绝）
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "本次版本：${TAG}（versionCode $((1000 + GITHUB_RUN_NUMBER))）"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用 Secrets 中的正式签名密钥"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次用 debug 签名（可安装，但不能用于上架）"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          LW_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LW_VERSION_NAME: ${{ steps.version.outputs.name }}
          LW_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/living-wallpaper-${{ steps.version.outputs.name }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" out/* --clobber
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "$TAG" out/* --title "$TAG" --generate-notes
          else
            # 手动触发时 tag 还不存在，用当前 commit 建
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
